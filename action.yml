# Kopfzeile: PROSTRUCTIVE® Consulting & Management, FSL-1.1-Apache-2.0, Herkunft attesta 0.1.0

name: "Attesta Zyklus"
description: "Prüft Arbeitspakete gegen Kritikalität, Delegationsstufe und Gate-Checkliste."
author: "PROSTRUCTIVE® Consulting & Management"

inputs:
  github-token:
    description: "Token mit contents: write, issues: write, pull-requests: write, checks: write."
    required: true
  lizenzschluessel:
    description: "Signierter Lizenzschluessel. Optional, eine abgelaufene oder fehlende Lizenz haelt den Lauf nicht an (REQ-35)."
    required: false

runs:
  using: "node20"
  main: "dist/index.js"

branding:
  icon: "check-circle"
  color: "blue"
